plugins {
    id 'java'
    id 'application'
}

group = 'se.chasacademy.fredrikhallstrom'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

application {
    mainClass = 'se.chasacademy.fredrikhallstrom.mysmarthome.Main'
}

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.mockito
    mockitoAgent(libs.mockito) { transitive = false }

    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"

    outputs.upToDateWhen { false }
}

tasks.named('jar') {
    dependsOn 'test'
    manifest {
        attributes'Main-class': 'main'
    }

    doFirst {
        println("Tester Godkända, Bygger JAR\n")
    }
}

tasks.named("run") {
    dependsOn('test')
    standardInput = System.in

    doFirst {println("Tester Godkända, Startar...\n")}

}